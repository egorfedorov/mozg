# mozg.sh: the pages are files; three paths go to the site's server.
#
# Inside the server { … } block of the site, beside the ssl_certificate lines.
# The pages are put at /srv/mozg/out by deploy.sh. The server is the container
# of docker-compose.yml, on 127.0.0.1:4318.

root  /srv/mozg/out;
index index.html;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

# The chat is written to by strangers: a second limit, in front of the server's own.
limit_req_zone $binary_remote_addr zone=mozg_chat:10m rate=2r/s;

location ^~ /api/chat/ {
    limit_req zone=mozg_chat burst=12 nodelay;
    proxy_pass http://127.0.0.1:4318;
    include /srv/mozg/proxy-params.conf;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:4318;
    include /srv/mozg/proxy-params.conf;
}

# The operator's panel. The server says noindex itself; this says it again.
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:4318;
    include /srv/mozg/proxy-params.conf;
}

# Static export, trailing slashes: /de/ is de/index.html, /docs/gate/ is docs/gate/index.html.
location / {
    try_files $uri $uri/ $uri/index.html =404;
}

error_page 404 /404.html;
