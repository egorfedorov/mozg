# mozg.sh: the pages are files; three paths go to the site's server.
#
# Two parts, in two places of nginx.
#
#   The one limit_req_zone line goes into the http { … } block: it parses there
#   and nowhere else, and there must be no copy of it anywhere else.
#
#   Everything else goes inside the server { … } block for mozg.sh and
#   www.mozg.sh, above nothing and below the ssl_certificate lines: certbot
#   manages those.
#
# The pages are put at /srv/mozg/out by deploy.sh, and left open to the user
# nginx reads as. The server is the container of docker-compose.yml, on
# 127.0.0.1:4318.
#
# The site file on the host holds more than this, and keeps it: whatever else
# is served under paths of mozg.sh, the names of the host, and the :80 turn to
# https. This is mozg's part alone.

# The chat is written to by strangers: a second limit, in front of the server's own.
limit_req_zone $binary_remote_addr zone=mozg_chat:10m rate=2r/s;

# ── from here on, inside the server block ───────────────────────────────────

root  /srv/mozg/out;
index index.html;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# A year of HTTPS-only: one plain-http hit on hostile wifi is a stolen session,
# and every thread of the chat that session can reach.
add_header Strict-Transport-Security "max-age=31536000" always;

location ^~ /api/chat/ {
    limit_req zone=mozg_chat burst=12 nodelay;
    proxy_pass http://127.0.0.1:4318;
    include /srv/mozg/proxy-params.conf;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:4318;
    include /srv/mozg/proxy-params.conf;
}

# The operator's panel. The server says noindex itself; this says it again.
location = /admin { return 301 /admin/; }
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:4318;
    include /srv/mozg/proxy-params.conf;
}

# The chunks carry a hash in their name and never change under it.
# add_header in a block replaces the ones above and does not add to them, so
# they are said again wherever one more is.
location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# Static export, trailing slashes: /de/ is de/index.html, /docs/gate/ is
# docs/gate/index.html. A page is asked for again every time, so a deploy is
# seen the day it happens.
location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/ $uri/index.html =404;
}

error_page 404 /404.html;

# Rate-limited requests get 429, not the default 503: a 503 tells a client the
# site is broken and invites retries.
limit_req_status 429;
