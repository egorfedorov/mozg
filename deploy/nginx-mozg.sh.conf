# nginx vhost for mozg.sh — sits alongside whatever else this box already
# serves (deisy.me), so nginx stays the single thing holding ports 80/443.
#
#   sudo cp deploy/nginx-mozg.sh.conf /etc/nginx/sites-available/mozg.sh
#   sudo ln -s /etc/nginx/sites-available/mozg.sh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mozg.sh -d www.mozg.sh --expand
#
# certbot rewrites this file to add the TLS lines and a :80 redirect.
#
# Rate limiting. limit_req_zone only parses in the http context, which is
# where this file lands: the stock nginx.conf includes sites-enabled/* inside
# its http block, so the zones live here and the config is self-contained —
# there must be NO copy of these two lines anywhere else (a duplicate zone is
# a fatal "zone is already defined" at nginx -t).

limit_req_zone $binary_remote_addr zone=mozg_mcp:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=mozg_auth:10m rate=10r/m;

# The MCP number is deliberately looser than it looks. The application already
# enforces 60 calls a minute per account (BURST_PER_MINUTE in lib/tokens.ts),
# with a message the agent can act on. nginx set tighter than that would not be
# a backstop — it would silently become the real policy, returning a bare 429
# to an agent midway through a task, and a single office behind one NAT would
# trip it constantly. This is the abuse ceiling; the app owns the per-account
# rule.

server {
    server_name mozg.sh www.mozg.sh learn.mozg.sh gallery.mozg.sh gen.mozg.sh;

    # Screenshots go up in batches of 20 MB each. nginx defaults to 1 MB, so
    # without this every upload fails with 413 and the browser shows nothing
    # useful about why.
    client_max_body_size 256m;

    # The MCP endpoint and the live call log are long-lived streams. Buffering
    # either makes agents hang and the log render nothing.
    location /mcp {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;

        # MCP is authenticated, but every call still costs an Anthropic round
        # trip — a runaway client should get 429s, not run the bill. The burst
        # absorbs the tool-call flurry at the start of an agent session.
        limit_req zone=mozg_mcp burst=60 nodelay;
    }

    location ~ ^/api/brains/[^/]+/calls/stream$ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }

    # Auth endpoints are the credential-guessing surface: 10 requests/minute
    # per IP with a small burst for legitimate form submissions. The zone is
    # defined at the top of this file (http context).
    location /api/auth/ {
        limit_req zone=mozg_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Rate-limited requests get 429, not the default 503 — a 503 tells clients
    # the server is broken and invites retries.
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # A year of HTTPS-only: one plain-http hit on hostile wifi is a stolen
    # session cookie, and every brain that cookie can reach.
    add_header Strict-Transport-Security "max-age=31536000" always;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mozg.sh/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mozg.sh/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot






}


server {
    if ($host = gallery.mozg.sh) {
        return 301 https://$host$request_uri;
    }


    if ($host = learn.mozg.sh) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.mozg.sh) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mozg.sh) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mozg.sh www.mozg.sh learn.mozg.sh gallery.mozg.sh gen.mozg.sh;
    return 404; # managed by Certbot






}