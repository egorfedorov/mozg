# nginx vhost for mozg.sh — sits alongside whatever else this box already
# serves (deisy.me), so nginx stays the single thing holding ports 80/443.
#
#   sudo cp deploy/nginx-mozg.sh.conf /etc/nginx/sites-available/mozg.sh
#   sudo ln -s /etc/nginx/sites-available/mozg.sh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mozg.sh -d www.mozg.sh
#
# certbot rewrites this file to add the TLS lines and a :80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name mozg.sh www.mozg.sh;

    # Screenshots go up in batches of 20 MB each. nginx defaults to 1 MB, so
    # without this every upload fails with 413 and the browser shows nothing
    # useful about why.
    client_max_body_size 256m;

    # The MCP endpoint and the live call log are long-lived streams. Buffering
    # either makes agents hang and the log render nothing.
    location /mcp {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    location ~ ^/api/brains/[^/]+/calls/stream$ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
