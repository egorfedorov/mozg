# Production stack for mozg.sh.
#
# TLS and ports 80/443 belong to the host's nginx, which already serves other
# sites on this box — see deploy/nginx-mozg.sh.conf. The app therefore binds to
# localhost only and is never reachable from outside except through nginx.
#
#   cp .env.example .env   # fill it in — see README "Deploy"
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mozg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mozg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mozg -d mozg"]
      interval: 5s
      timeout: 5s
      retries: 20

  embed:
    build: ./services/embed
    restart: unless-stopped
    volumes:
      - models:/models
    # First boot downloads 2.2 GB of weights into the volume; give it room
    # before the healthcheck starts calling it dead.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 900s
    deploy:
      resources:
        limits:
          memory: 4g

  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # Localhost only. Exposing 3300 publicly would bypass nginx and serve the
    # app without TLS.
    ports:
      - "127.0.0.1:3300:3300"
    env_file: .env
    environment:
      DATABASE_URL: postgres://mozg:${POSTGRES_PASSWORD}@db:5432/mozg
      EMBED_URL: http://embed:8099
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    command: ["npm", "run", "worker:prod"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://mozg:${POSTGRES_PASSWORD}@db:5432/mozg
      EMBED_URL: http://embed:8099
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
  storage:
