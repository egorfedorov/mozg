# Production stack for mozg.sh.
#
# TLS and ports 80/443 belong to the host's nginx, which already serves other
# sites on this box — see deploy/nginx-mozg.sh.conf. The app therefore binds to
# localhost only and is never reachable from outside except through nginx.
#
#   cp .env.example .env   # fill it in — see README "Deploy"
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Tuned for the actual host (62 GB RAM), not the container defaults: with
    # shared_buffers at the stock 128 MB the 400 MB HNSW index could not even
    # fit in Postgres's own cache and every vector search paged through the
    # OS. maintenance_work_mem is what HNSW builds eat; work_mem serves the
    # RRF CTEs in search.
    command:
      - postgres
      - -c
      - shared_buffers=6GB
      - -c
      - effective_cache_size=32GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=32MB
      - -c
      - wal_compression=on
    environment:
      POSTGRES_USER: mozg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mozg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mozg -d mozg"]
      interval: 5s
      timeout: 5s
      retries: 20
    # json-file logs grow without bound by default; an unrotated container log
    # can quietly fill the disk. 3 x 50 MB per service is enough for
    # postmortems, not enough to starve postgres.
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  # Two lanes, one image. Ingest embeds in batches of 64 and never minds
  # waiting; a search is a person watching an agent think. Sharing one process
  # meant interactive queries queued behind the batches — that is how a 2.6s
  # search became 87s at the 95th percentile while the catalogue was seeding.
  #
  # The split costs a second copy of the weights (~3 GB) on a host with 56 GB
  # free, and the thread budgets add up to the 16 cores available.
  embed:
    build: ./services/embed
    restart: unless-stopped
    volumes:
      - models:/models
    environment:
      # Three lanes now (ingest embed / query embed / rerank); the thread
      # budgets still sum to the 16 cores. Ingest is the one that never minds
      # waiting, so it gives up cores to the reranker.
      EMBED_THREADS: "4"
    # First boot downloads 2.2 GB of weights into the volume; give it room
    # before the healthcheck starts calling it dead.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 900s
    deploy:
      resources:
        limits:
          # Measured, not estimated: bge-m3 alone sits at 3.0 GB resident on
          # production — not the ~2 GB the budget assumed. Loading the reranker
          # on top of that inside a 4 GB limit is an OOM, and an OOM here takes
          # search and ingest down together.
          #
          # The host has 62 GB with under 1 GB in use by everything else, so a
          # tight limit buys nothing. This is a runaway guard, not a budget.
          memory: 8g
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  # The interactive lane: only the app talks to it, so a search never waits
  # behind ingest. Same image, same weights volume, more threads — this is the
  # one whose latency a user feels.
  embed-query:
    build: ./services/embed
    restart: unless-stopped
    volumes:
      - models:/models
    environment:
      # Query embedding only, now that reranking has its own service below:
      # one short text per search, milliseconds of work — two threads is
      # plenty and the reranker gets the cores back.
      EMBED_THREADS: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 900s
    deploy:
      resources:
        limits:
          memory: 8g
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  # The reranker's own lane. It shared a process with query embedding, and a
  # cross-encoder scoring 12 (query, doc) pairs on CPU is seconds of work —
  # searches queued behind each other into a p50 of 6.9s and a p95 of 54s.
  # Isolated, int8-quantized, and given the most threads of the three lanes,
  # because this is the one a person is watching.
  rerank:
    build: ./services/embed
    restart: unless-stopped
    volumes:
      - models:/models
    environment:
      EMBED_THREADS: "10"
      RERANK_QUANTIZE: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 900s
    deploy:
      resources:
        limits:
          memory: 8g
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    networks: [default, rendernet]
    # Localhost only. Exposing 3300 publicly would bypass nginx and serve the
    # app without TLS.
    ports:
      - "127.0.0.1:3300:3300"
    env_file: .env
    environment:
      # POSTGRES_PASSWORD is interpolated into a URL and compose cannot
      # percent-encode it: the password must not contain @ : or /. Stick to
      # letters, digits, - and _ when rotating.
      DATABASE_URL: postgres://mozg:${POSTGRES_PASSWORD}@db:5432/mozg
      # The app is the interactive side: query embedding and reranking each
      # get a lane nothing else uses.
      EMBED_URL: http://embed-query:8099
      RERANK_URL: http://rerank:8099
      RENDER_URL: http://render:8100
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    # The slim image has neither curl nor wget; node 20's global fetch stands
    # in. /api/health is the same endpoint the deploy smoke test checks.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    networks: [default, rendernet]
    command: ["node", "dist/worker/index.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://mozg:${POSTGRES_PASSWORD}@db:5432/mozg
      # Ingest batches on the batch lane; the exam's retrieval on the
      # interactive one, because a score has to describe what a caller gets.
      EMBED_URL: http://embed:8099
      EMBED_QUERY_URL: http://embed-query:8099
      RERANK_URL: http://rerank:8099
      RENDER_URL: http://render:8100
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    # No HTTP port to probe and no pgrep in the slim image, so the check walks
    # /proc for the worker's node process. Docker's restart policy covers a
    # clean crash; this catches the stranger case where the container is alive
    # but the worker process is gone.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const fs=require('fs');const ok=fs.readdirSync('/proc').some(d=>/^\\d+$/.test(d)&&(()=>{try{return fs.readFileSync('/proc/'+d+'/cmdline','utf8').includes('worker/index')}catch{return false}})());process.exit(ok?0:1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  # Headless Chromium for JS-shell docs sites. Its own network on purpose:
  # a hostile page rendered in here must not be able to reach the database —
  # rendernet holds only this service and the two that call it.
  render:
    build: ./services/render
    restart: unless-stopped
    networks: [rendernet]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "2"


volumes:
  pgdata:
  models:
  storage:

networks:
  default: {}
  rendernet: {}
