# Production stack for mozg.sh.
#
#   cp .env.example .env   # fill it in — see README "Deploy"
#   docker compose -f docker-compose.prod.yml up -d
#
# Caddy terminates TLS and gets a certificate for mozg.sh automatically, so
# there is no certbot step and no renewal cron.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mozg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mozg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mozg -d mozg"]
      interval: 5s
      timeout: 5s
      retries: 20

  embed:
    build: ./services/embed
    restart: unless-stopped
    volumes:
      - models:/models
    # First boot downloads 2.2 GB of weights; give it room before the
    # healthcheck starts failing.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 900s
    deploy:
      resources:
        limits:
          memory: 4g

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://mozg:${POSTGRES_PASSWORD}@db:5432/mozg
      EMBED_URL: http://embed:8099
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker:prod"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://mozg:${POSTGRES_PASSWORD}@db:5432/mozg
      EMBED_URL: http://embed:8099
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
  storage:
  caddy-data:
  caddy-config:
